name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:ember

  floating-deps:
    name: Floating Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install latest deps (no lockfile)
        run: npm install --no-package-lock

      - name: Run tests
        run: npm run test:ember

  try-scenarios:
    name: 'Try: ${{ matrix.scenario }}'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ember-lts-4.4.5
          - ember-lts-4.8.6
          - ember-lts-4.12.3
          - ember-release
          - ember-default-with-jquery
          - ember-classic
        include:
          # Allow these to fail without failing the workflow.
          - scenario: ember-beta
            allow-failure: true
          - scenario: ember-canary
            allow-failure: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ember-try scenario
        run: npx ember try:one ${{ matrix.scenario }} --skip-cleanup
        continue-on-error: ${{ matrix.allow-failure == true }}
